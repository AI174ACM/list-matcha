<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лист матча</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#F5F5F7"><link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500 800;font-display:swap;src:url(fonts/JetBrainsMono-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500 800;font-display:swap;src:url(fonts/JetBrainsMono-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500 800;font-display:swap;src:url(fonts/Onest-latin.woff2) format('woff2');unicode-range:U+0030}
@font-face{font-family:'Onest';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/Onest-cyrillic.woff2) format('woff2');unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116}
@font-face{font-family:'Onest';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/Onest-latin.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
/* Цвета: графит, белый, серые, оранжевый, бордо — только знак «!» и слово. */
:root{
  --num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --bg:#F5F5F7; --card:#FFFFFF; --tile:#F2F2F4; --tileH:#E8E8EC; --ink:#1D1D1F; --ink2:#5E5E63; --ink3:#AEAEB2; --src:#6E6E73;
  --line:rgba(0,0,0,.08); --acc:#F26A1B; --accT:242,106,27; --btn:#C94F0E; --btnTx:#FFFFFF; --accSoft:#FDEADF;
  --bad:#9B1C3A; --sel:#1D1D1F; --selTx:#FFFFFF; --inv:#FFFFFF; --r:16px; --glow:none;
  --actH:1fr; --actFs:17px; --tileNum:30px;
}
html[data-theme="board"]{
  --bg:#000000; --card:#141416; --tile:#202023; --tileH:#2C2C2F; --ink:#F5F5F7; --ink2:#A1A1A6; --ink3:#5A5A5E; --src:#98989D;
  --line:rgba(255,255,255,.08); --acc:#FF7A2F; --accT:255,122,47; --btn:#FF7A2F; --btnTx:#1D1D1F; --accSoft:#432B1F;
  --bad:#EE6F8E; --sel:#FF7A2F; --selTx:#1D1D1F; --inv:#141416; --glow:0 0 18px rgba(255,122,47,.35);
}
html[data-theme="tiles"]{
  --bg:#E6E6EA; --card:transparent; --tile:#FFFFFF; --tileH:#F6F6F8; --ink:#1D1D1F; --ink2:#4A4A4F; --ink3:#9A9AA0;
  --line:rgba(0,0,0,.10); --r:10px; --actFs:19px; --tileNum:38px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:15px/1.25 Onest,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.app{height:100vh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);gap:10px;padding:12px 14px}

/* верх */
.top{display:flex;align-items:center;gap:14px;min-width:0}
.sc{display:flex;align-items:center;gap:12px;white-space:nowrap}
.sc .tm{font-size:20px;font-weight:700}
.sc .num{font:800 40px/1 var(--num);letter-spacing:-.02em}
.sc .venue{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--btn);background:var(--accSoft);padding:3px 7px;border-radius:6px}
html[data-theme="board"] .sc .venue{color:var(--acc)}
.per{display:flex;align-items:center;background:var(--card);border-radius:12px;height:52px}
.per button{width:44px;height:52px;font-size:22px;color:var(--ink2)}
.per b{min-width:118px;text-align:center;font-size:17px}
.sp{flex:1}
.seg{display:inline-flex;background:var(--card);border-radius:12px;padding:4px;gap:2px}
.seg button{padding:0 16px;height:44px;border-radius:9px;font-weight:700;color:var(--ink2);white-space:nowrap}
.seg button.on{background:var(--sel);color:var(--selTx)}
.seg.small button{padding:0 11px;font-size:13px}
.mbtn{height:52px;padding:0 18px;border-radius:12px;background:var(--card);font-weight:700}
html[data-theme="tiles"] .per,html[data-theme="tiles"] .seg,html[data-theme="tiles"] .mbtn{background:#fff;box-shadow:inset 0 0 0 2px var(--ink)}

.sync{font-size:13px;color:var(--ink2);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink);flex:none}
.sync.wait i{background:none;box-shadow:inset 0 0 0 2px var(--ink2)}
.sc .tm{cursor:pointer}
.pdate{display:none}
.tl.off{opacity:.45}
.pop{position:fixed;z-index:6;width:236px;display:grid;grid-template-columns:1fr;gap:5px;background:var(--card);border-radius:18px;padding:10px;box-shadow:0 10px 34px rgba(0,0,0,.16),0 0 0 1px var(--line);animation:popIn .12s ease-out}
@keyframes popIn{from{opacity:0;transform:scale(.97)}}
.pop::before{content:"";position:absolute;width:14px;height:14px;background:inherit;transform:rotate(45deg);border-radius:3px}
.pop.r::before{left:-6px;top:calc(var(--ay) - 7px)} .pop.l::before{right:-6px;top:calc(var(--ay) - 7px)}
.pop.b::before{top:-6px;left:calc(var(--ax) - 7px)} .pop.t::before{bottom:-6px;left:calc(var(--ax) - 7px)}
.pb{position:relative;height:44px;border-radius:11px;background:var(--tile);font-weight:600;font-size:15px;line-height:1.1;padding:0 12px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb:hover{background:var(--tileH)} .pb:active{transform:scale(.98)}
.pop.so{gap:8px} .pop.so .pb{height:60px;font-size:18px;text-align:center}
.pb.goal{background:var(--btn);color:var(--btnTx);font-weight:800;text-align:center;font-size:17px}
html[data-theme="board"] .pop{background:#1c1c1f;box-shadow:0 10px 34px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.14)} html[data-theme="board"] .pb{background:#2a2a2e} html[data-theme="board"] .pb:hover{background:#36363b} html[data-theme="board"] .pb.goal{background:var(--btn)}
html[data-theme="tiles"] .pop{background:#fff;box-shadow:0 10px 34px rgba(0,0,0,.22),0 0 0 2px var(--ink)} html[data-theme="tiles"] .pop::before{display:none}
html[data-theme="tiles"] .pb{background:var(--bg)} html[data-theme="tiles"] .pb.goal{background:var(--btn)}
/* пока открыт список, остальное отступает на второй план */
.main .col.side,.main .tl,.main .cap,.main .foot{transition:opacity .12s}
.main.picking .col.side{opacity:.4} .main.picking .tl:not(.pick){opacity:.4} .main.picking .mid .cap,.main.picking .mid .foot{opacity:.4}
.tl.nw{box-shadow:inset 0 0 0 3px var(--acc)} .tl.nw em{color:var(--acc)}
.sheet.drag{outline:3px dashed var(--acc);outline-offset:-10px}
.tl em{position:absolute;top:6px;left:0;right:0;text-align:center;font:700 10px Onest,sans-serif;font-style:normal;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.mlist{display:flex;flex-direction:column;gap:6px;margin:14px 0;max-height:60vh;overflow:auto}
.mrow{display:flex;align-items:center;gap:14px;padding:0 16px;min-height:56px;border-radius:12px;background:var(--tile);text-align:left;font-size:17px;font-weight:600}
.mrow:hover{background:var(--tileH)} .mrow .n{font-weight:800;margin-left:auto} .mrow small{color:var(--src);font-weight:500;font-size:13px}
/* полоса положения */
.strip{display:flex;align-items:center;gap:12px;min-height:54px;padding:6px 8px 6px 18px;border-radius:var(--r);background:var(--card)}
.strip .what{font-size:19px;font-weight:700;white-space:nowrap}
.strip .what .n{font-weight:800}
.strip .sign{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;background:var(--bad);color:#fff;font-weight:800;margin-right:8px;transform:rotate(45deg)}
.strip .sign span{transform:rotate(-45deg)}
.strip.pp{background:var(--accSoft)} .strip.pp .what{color:var(--btn)}
html[data-theme="board"] .strip.pp .what{color:var(--acc)}
.strip.pk{background:var(--ink);color:var(--inv)} .strip.pk .chipb{background:rgba(255,255,255,.12);color:inherit}
html[data-theme="board"] .strip.pk{background:#2a2a2e;color:#fff}
.pens{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.pchip{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:10px;background:rgba(0,0,0,.05);font-size:14px;white-space:nowrap}
html[data-theme="board"] .pchip{background:rgba(255,255,255,.08)}
.pchip button{height:32px;padding:0 10px;border-radius:8px;background:var(--inv);color:var(--ink);font-size:13px;font-weight:700}
.chipb{height:44px;padding:0 14px;border-radius:10px;background:var(--tile);font-weight:600;font-size:14px;white-space:nowrap}
.chipb.on{background:var(--sel);color:var(--selTx)}

/* основная часть */
.main{display:grid;grid-template-columns:minmax(230px,23%) minmax(0,1fr) minmax(260px,26%);gap:10px;min-height:0}
.col{background:var(--card);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;min-height:0;gap:8px}
.cap{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;padding:2px 4px}
/* действия */
.acts{display:grid;grid-template-rows:repeat(7,minmax(46px,1fr)) minmax(64px,1.5fr) minmax(46px,1fr);gap:6px;flex:1;min-height:0}
.act{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:12px;background:var(--tile);text-align:left;font-size:var(--actFs);font-weight:600;line-height:1.1}
.act:hover{background:var(--tileH)}
.acts.so{grid-template-rows:none;grid-auto-rows:minmax(46px,64px);flex:none;margin-top:auto} .acts.so .cap{align-self:end}
.sob{display:grid;gap:8px;padding:2px 4px} .sob .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center} .sob .r b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .sob .t{font:800 26px/1 var(--num)}
.sob .cs{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap;min-height:24px} .sob i{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink3);display:grid;place-items:center;font:700 10px var(--num);font-style:normal;color:var(--ink2)} .sob i.y{background:var(--acc);border-color:var(--acc);color:#1D1D1F}
.act .k{margin-left:auto;font:700 12px var(--num);color:var(--ink3);border:1.5px solid var(--line);border-radius:6px;padding:2px 6px}
.act .c{font:800 15px var(--num);color:var(--ink2);min-width:1.4em;text-align:right}
.act.on{background:var(--sel);color:var(--selTx)} .act.on .c,.act.on .k{color:inherit;border-color:rgba(255,255,255,.3)}
.act.goal{background:var(--btn);color:var(--btnTx);font-size:22px;font-weight:800;justify-content:center;box-shadow:var(--glow)}
.act.goal .k{position:absolute;right:12px;color:inherit;opacity:.7;border-color:currentColor}
.act.goal,.act.ga{position:relative}
.act.ga{justify-content:center;box-shadow:inset 0 0 0 2px var(--ink);background:transparent;font-weight:700}
html[data-theme="tiles"] .act{background:var(--ink);color:#fff;text-transform:uppercase;letter-spacing:.02em;font-weight:800;font-size:16px}
html[data-theme="tiles"] .act .c,html[data-theme="tiles"] .act .k{color:#fff;border-color:rgba(255,255,255,.3)}
html[data-theme="tiles"] .act.on{background:var(--acc)}
html[data-theme="tiles"] .act.goal{background:var(--btn)}
html[data-theme="tiles"] .act.ga{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}
/* игроки */
.hint{font-size:19px;font-weight:600;padding:4px 6px 2px;min-height:34px;color:var(--ink2)}
.hint b{color:var(--ink)} html[data-theme="board"] .hint b{color:var(--acc)}
.pgrp{display:flex;flex-direction:column;min-height:0;gap:4px} .pgrp+.pgrp{margin-top:4px}
.pgrp.f{flex:2}.pgrp.d{flex:1}
.pgrp .tl{padding-top:16px;overflow:hidden} .pgrp .tl:not(.gkt):not(.gks)>i{top:23px;right:6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--ink);color:var(--inv);display:grid;place-items:center;font-size:12px;opacity:1}
/* амплуа — шапка плитки (слова Антона 17.11: серый тон защитников не нравится): нападающий — без заливки, защитник — графит, вратарь — оранжевый клуба */
.pgrp .tl em{top:0;left:0;right:0;height:17px;font-size:10px;line-height:17px;letter-spacing:.08em;color:var(--ink2);padding:0}
.pgrp.d .tl em{background:var(--ink);color:var(--inv)}
.pgrp .tl.gkt em{background:var(--acc);color:#1D1D1F}
.pgrp .tl.gks em{background:none;color:var(--ink2);top:2px}
.pgrp .tl.pick em{color:inherit;opacity:.75;background:none} .pgrp.d .tl.pick em{background:rgba(255,255,255,.22);opacity:1}
html[data-theme="tiles"] .pgrp .tl em{top:2px;left:2px;right:2px;border-radius:6px 6px 0 0} html[data-theme="tiles"] .pgrp .tl.pick em{top:0;left:0;right:0}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:1fr;gap:8px;flex:1;min-height:0}
.tl{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;background:var(--tile);min-height:60px;transition:transform .08s}
.tl:hover{background:var(--tileH)}
.tl:active{transform:scale(.97)}
.tl b{font:800 var(--tileNum)/1 var(--num)}
.tl span{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%}
.tl i{position:absolute;top:6px;right:8px;font:800 13px var(--num);font-style:normal;color:var(--ink2)}
.tl.pick{background:var(--sel);color:var(--selTx)} .tl.pick span,.tl.pick i{color:inherit;opacity:.8}
.tl.flash{animation:fl .7s}
.tl.gks{background:none;box-shadow:inset 0 0 0 2px var(--line);color:var(--ink2);margin:0} .tl.gks b{font-size:calc(var(--tileNum)*.6)} .tl.gks span{font-size:11px}  .tl.gks:hover{background:var(--tile)} .tl.gks i{position:static;background:none;min-width:0;height:auto;padding:0;font:600 10px/1.15 Onest,sans-serif;font-style:normal;color:var(--ink2);white-space:nowrap}
.tl.gkt{background:none;box-shadow:inset 0 0 0 2px var(--acc)} .tl.gkt:hover{background:var(--accSoft)}  .tl.gkt{background:var(--accSoft);box-shadow:inset 0 0 0 3px var(--acc);gap:1px} .tl.gkt b{font-size:var(--tileNum)} .tl.gkt i{position:static;display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:clamp(4px,1.3vh,12px);color:var(--ink2);font:600 12px/1.1 Onest,sans-serif;white-space:nowrap} .tl.gkt i u{text-decoration:none;font:800 18px/1 var(--num);letter-spacing:-.04em;color:var(--ink)}
html[data-theme="board"] .tl.gkt i u{color:#fff}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
html[data-theme="board"] .tl b{text-shadow:0 0 14px rgba(255,255,255,.18)}
html[data-theme="tiles"] .tl{border-radius:8px;box-shadow:inset 0 0 0 2px var(--ink)}
html[data-theme="tiles"] .tl.pick{background:var(--acc);color:#fff;box-shadow:none}
.foot{font-size:14px;color:var(--ink2);padding:2px 6px}
.foot b{color:var(--ink);font-family:var(--num)}
/* лента */
.feed{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
.it{display:flex;align-items:center;gap:8px;padding:8px 6px 8px 12px;border-radius:12px;background:var(--tile);font-size:15px}
.it .tx{flex:1;min-width:0}
.it .tx b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .tx small{color:var(--src);font-size:12px}
.it .tx .as{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .x.ed{font-size:19px}
.it.new{box-shadow:inset 4px 0 0 var(--acc)}
.it.goal{background:var(--accSoft)}
.it .x{width:44px;height:44px;border-radius:10px;font-size:22px;color:var(--ink2);flex:none}
.it .x:hover{background:var(--card);color:var(--ink)}
.undo{height:52px;border-radius:12px;background:var(--ink);color:var(--inv);font-weight:700;font-size:16px}
html[data-theme="board"] .undo{background:#2C2C2E;color:#fff}
html[data-theme="tiles"] .undo{background:var(--ink);color:#fff}

/* итоги */
.sumv{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:10px;min-height:0}
.tbl{background:var(--card);border-radius:var(--r);overflow:hidden;min-height:0;container-type:size;--rh:min(38px,calc((100cqh - 74px)/var(--rows,25)))}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:var(--card);font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em;padding:0 4px;height:calc(var(--rh)*1.7);text-align:center;line-height:1.15;border-bottom:1px solid var(--line)}
th.l,td.l{text-align:left;padding-left:14px}
td{text-align:center;border-bottom:1px solid var(--line);height:38px;font:700 17px var(--num)}
.tbl td{height:var(--rh);font-size:min(17px,calc(var(--rh)*.5));line-height:1}
.tbl td.l{font-size:min(16px,calc(var(--rh)*.5))}
.tbl tr.g td{height:calc(var(--rh)*.8);font-size:min(11px,calc(var(--rh)*.42))}
.tbl th{font-size:min(11px,calc(var(--rh)*.42))}
td.l{font:600 16px Onest,sans-serif;white-space:nowrap}
td.l .no{display:inline-block;width:2em;color:var(--ink3);font-family:var(--num)}
td.z{color:var(--ink3);font-weight:400}
td.cl{cursor:pointer} td.cl:hover{background:var(--tile)}
tr.g td{background:var(--tile);height:28px;font:700 11px Onest,sans-serif;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding-left:14px}
tr.t td{font-size:14px;color:var(--ink2)}
td.gp{color:var(--ink2);font-weight:500}
td small{font-size:.7em;font-weight:500;color:var(--ink2);margin-left:1px}
.tr{font-size:.55em;color:var(--ink2);margin-left:3px;vertical-align:middle}
.pt tr.sumr td{border-bottom:0;font-weight:800} .pt tr.sumr td:first-child{color:var(--ink)}
.sm{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-weight:600}
.sm .d{font:600 13px var(--num);color:var(--src)} .sm .s{font:800 16px var(--num)} .sm .w{min-width:0} .sm small{color:var(--ink2);font-weight:500}
.sm .y{display:block;font-size:12px} .sm.off .w,.sm.off .s{color:var(--ink2)} .sm.off .s{font-weight:500}
.box.empty{padding:28px} .box.empty h2{margin:0 0 8px;font-size:26px} .box.empty .sub{max-width:34em;line-height:1.45}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-left:3px;vertical-align:super}
.warn{color:var(--bad);font-size:12px;margin-left:2px;vertical-align:super}
.side{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}
.box{background:var(--card);border-radius:var(--r);padding:14px 16px}
.gl{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.gl .t{font:600 12px var(--num);color:var(--src)} .gl .s{font:800 17px var(--num)}
.gl .w{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}

  const i=S.pens.findIndex(p=>p.side===side&&(p.kind==='minor'||p.kind==='double'));if(i<0)return null;

function goalSheet(ours,sc0,egid){sh.classList.remove('narrow');
  const s0=sit();
  const pre=ours&&sc0!=null&&!!P(sc0);
  const g={step:ours?(pre?2:1):3,sc:pre?sc0:null,as:[],on:new Set(pre?[sc0]:[]),key:s0.key,t:''};
  /* правка записанного гола: те же шаги, заполненные тем, что записано; период, время записи и источник остаются прежними */
  const old=egid!=null?S.ev.filter(e=>e.gid===egid):null,og=old&&old.find(e=>e.k==='g'||e.k==='ga');
  if(og){g.sc=og.k==='g'&&!og.unknown?og.n:null;g.as=old.filter(e=>e.k==='a').map(e=>e.n);g.on=new Set(old.filter(e=>e.k==='pm').map(e=>e.n));g.key=og.sit||'5x5';g.t=og.t||'';g.step=ours?1:3}
  const need=()=>+g.key.split('x')[0];
  const draw=()=>{
    const q=g.step===1?'Кто забил? Бросок ему засчитается сам':g.step===2?'Кто отдал передачу? (до двух)':`Кто ещё был на льду? Отмечено ${g.on.size} из ${need()}`;
    const slots=[...g.on];const sl=[];for(let i=0;i<Math.max(need(),slots.length);i++){const n=slots[i];sl.push(`<span class="slot${n!=null?(n===g.sc?' g':' f'):''}">${n!=null?n:''}</span>`)}
    const tile=p=>{const c=g.sc===p.n?'sc1':g.as.includes(p.n)?'as1':g.on.has(p.n)?'on1':'';const tg=c==='sc1'?'ГОЛ':c==='as1'?'ПАС':'';
      return `<button class="tl ${c}" data-t="${p.n}"><b>${p.n}</b><span>${p.name}</span>${tg?`<i>${tg}</i>`:''}</button>`};
    sh.innerHTML=`<div class="row"><h2>${og?'Изменить гол':ours?'Гол':'Гол в наши ворота'}</h2><span class="sub">${PN(og?og.p:S.cur)} · ${SITW[sitOf(g.key)]} ${g.key.replace('x',' на ')}</span><button class="btn" style="height:44px;font-size:14px" data-chs>Изменить</button><span class="sp"></span><label class="sub">Время гола (можно пропустить) <input type="text" id="gT" value="${g.t}" placeholder="мм:сс" style="width:90px"></label></div>
     <div id="chs" style="display:none" class="row">${['5x5','4x4','3x3','5x4','5x3','4x3','4x5','3x5','3x4','6x5','5x6'].map(k=>`<button class="chipb${k===g.key?' on':''}" data-key="${k}">${k.replace('x',' на ')}</button>`).join('')}</div>
     ${ours?`<div class="steps">${[[1,'Кто забил',g.sc?nm(g.sc):'—'],[2,'Передачи',g.as.length?g.as.map(snm).join(', '):'—'],[3,'На льду',g.on.size+' из '+need()]].map(([n,a,b])=>`<button class="stp${g.step===n?' on':''}${g.step>n?' done':''}" data-step="${n}"><em>${g.step>n?'✓':n}</em><span>${a}<b>${b}</b></span></button>`).join('')}</div>`:'<div style="height:14px"></div>'}
     <div class="q">${q}</div>
     ${g.step===3?`<div class="slots">${sl.join('')}</div>`:''}
     <div class="lbl">Нападающие</div><div class="gtiles">${ord().filter(p=>p.pos==='н').map(tile).join('')}</div>
     <div class="lbl">Защитники</div><div class="gtiles">${ord().filter(p=>p.pos==='з').map(tile).join('')}</div>
     <div class="row" style="margin-top:16px">${ours&&g.step===2?'<button class="btn dark" data-next>Без передач →</button>':''}${ours&&g.step===1?'<button class="btn" data-next>Не знаю номер — дальше</button>':''}<span class="sp"></span><button class="btn" data-x>Отмена</button><button class="btn acc" data-ok>${og?'Сохранить изменения':'Записать гол'} · Enter</button></div>`;
  };
  const ok=()=>{g.t=(document.getElementById('gT')||{}).value||g.t;
    if(og){const at=S.ev.findIndex(e=>e.gid===egid),was=JSON.stringify(old),base={gid:egid,p:og.p,src:og.src,...(og.ts?{ts:og.ts}:{})},nw=[],mk=(n,k,x={})=>nw.push({id:S.nextId++,...base,n,k,...x});
      if(ours){if(g.sc!=null){mk(g.sc,'sh');mk(g.sc,'g',{sit:g.key,t:g.t})}else mk(null,'g',{sit:g.key,t:g.t,unknown:true});g.as.forEach(n=>mk(n,'a'))}
      else mk(null,'ga',{sit:g.key,t:g.t,...(og.gk!=null?{gk:og.gk}:{})});
      g.on.forEach(n=>mk(n,'pm',{v:ours?1:-1}));
      S.ev=S.ev.filter(e=>e.gid!==egid);S.ev.splice(at<0?S.ev.length:at,0,...nw);
      UI.lastGid=egid;save();close_();render();
      snack('Гол изменён'+(ours?' · '+(g.sc!=null?snm(g.sc):'номер не указан'):''),'Вернуть как было',()=>{const i=S.ev.findIndex(e=>e.gid===egid);S.ev=S.ev.filter(e=>e.gid!==egid);S.ev.splice(i<0?S.ev.length:i,0,...JSON.parse(was));save();render()});return}
    const gid=S.nextId;

    else push(gid,null,'ga',{sit:g.key,t:g.t,...(gk0()&&!S.pull.us?{gk:gk0().n}:{})});

    const ty=sitOf(g.key);let msg='';const pensWas=JSON.stringify(S.pens);

    UI.lastGid=gid;save();close_();render();
    snack((ours?'Гол записан'+(g.sc!=null?' · бросок засчитан':''):'Пропущенный гол записан')+(msg?' · '+msg:''),'Отменить',()=>{delGroup(gid,true);if(msg){S.pens=JSON.parse(pensWas);save();render()}});
  };
  sh.onclick=e=>{const b=e.target.closest('button');if(!b)return;g.t=(document.getElementById('gT')||{}).value||g.t;
    if('chs' in b.dataset){const c=document.getElementById('chs');c.style.display=c.style.display==='none'?'flex':'none';return}
    if(b.dataset.key){g.key=b.dataset.key}
    else if(b.dataset.step){g.step=+b.dataset.step}
    else if('next' in b.dataset){g.step++}
    else if(b.dataset.t){const n=+b.dataset.t;
      if(g.step===1){if(g.sc!=null)g.on.delete(g.sc);g.sc=n;g.as=g.as.filter(x=>x!==n);g.on.add(n);g.step=2}
      else if(g.step===2){if(n===g.sc)return; if(g.as.includes(n)){g.as=g.as.filter(x=>x!==n);g.on.delete(n)}else if(g.as.length<2){g.as.push(n);g.on.add(n)} if(g.as.length===2)g.step=3}
      else{if(n===g.sc||g.as.includes(n))return; g.on.has(n)?g.on.delete(n):g.on.add(n)}}
    else if('x' in b.dataset){close_();return}
    else if('ok' in b.dataset){ok();return}
    draw()};
  sh.onkey=e=>{if(e.key==='Enter'&&e.target.id!=='gT')ok()};
  draw();open_();
}

    if(b.dataset.u){const p=R.find(x=>x.n===+b.dataset.u);if(p){p.out=true;tidy()}draw();return}
    if('mode' in b.dataset){lines=!lines;sel=null;tidy();draw();return}
    if(b.parentElement.id==='fV'){ven=b.textContent;draw();return}
    if(b.dataset.np){np=b.dataset.np;const n=nN.value,fam=nF.value;draw();nN.value=n;nF.value=fam;return}
    if(b.dataset.t){const p=R.find(x=>x.n===+b.dataset.t);p.out=!p.out;draw();return}
    if('add' in b.dataset){const n=parseInt(nN.value,10),name=nF.value.trim();
      if(!(n>=0)||!name){snack('Впишите номер и фамилию','Понятно',()=>{});return}
      if(R.some(x=>x.n===n)){snack('Номер '+n+' уже есть: '+R.find(x=>x.n===n).name,'Понятно',()=>{});return}
      R.push({n,name:name[0].toUpperCase()+name.slice(1),pos:np,out:false});draw();return}
    if('list' in b.dataset){if(list)fromList();list=!list;draw();return}
    if('cloud' in b.dataset){cloud();return}
    if('file' in b.dataset){fi.click();return}
    if('x' in b.dataset){close_();return}
    if('ok' in b.dataset){if(list)fromList();if(!R.some(p=>!p.out)){snack('Отметьте хотя бы одного игрока','Понятно',()=>{});return}
      R.forEach(p=>delete p.fresh);tidy();S.gk=G.slice(0,2);Object.assign(S,{roster:srt().map(rcopy),home:f.h.trim()||'Челмет',away:f.a.trim()||'Соперник',date:f.d.trim()||today(),venue:ven});
      sync.flag('lm_rdirty',true);save();close_();render()}};
  draw();open_(); if(isNew&&sync.on()&&!sync.flag('lm_rdirty'))cloud(true);
}
function pastSheet(){sh.classList.remove('narrow');
  let rows=archList().map(m=>({id:m.id,date:m.date,home:m.home,away:m.away,venue:m.venue,local:m}));
  const draw=msg=>{sh.innerHTML=`<h2>Прошлые матчи</h2><p class="sub">${msg||'Нажмите на матч, чтобы открыть его.'}</p>
    <div class="mlist">${rows.filter(r=>r.id!==S.id).map(r=>`<button class="mrow" data-id="${r.id}"><span>${r.date||''}</span><span>${rinkOrder(r.venue,r.home,r.away).map(esc).join(' – ')}</span><span class="n">${esc(r.local?scoreOf(r.local):listedScore(r))}</span></button>`).join('')||'<div class="sub">Других матчей пока нет</div>'}</div>
    <div class="row">${VIEW&&viewId?'<button class="btn" data-live>Вернуться к текущему матчу</button>':''}<span class="sp"></span><button class="btn dark" data-x>Закрыть</button></div>`};
  sh.onclick=async e=>{const b=e.target.closest('button');if(!b)return;if('x' in b.dataset){close_();return}
    if('live' in b.dataset){viewId=null;close_();pull();return}
    const r=rows.find(x=>x.id===b.dataset.id);if(!r)return;
    try{let m=r.local;if(!m){draw('Открываю…');m=(await api({op:'get',id:r.id})).match}
      if(!m)throw 0; if(VIEW)viewId=m.id; else archive(S); S=norm(m); if(!VIEW){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}}
      UI.tab=VIEW?'sum':UI.tab;close_();render()}
    catch(_){draw('Не удалось открыть матч — нет связи с таблицей.')}};
  draw();open_();
  if(API&&(WKEY||VIEW))api({op:'list'},8000).then(r=>{const have=new Set(rows.map(x=>x.id));for(const m of r.list)if(!have.has(m.id))rows.push(m);rows.sort((a,b)=>(b.id>a.id?1:-1));if(ov.classList.contains('on')&&sh.querySelector('.mlist'))draw()}).catch(()=>{});
}
function dl(name,content,type){
  const file=content instanceof Blob?content:new Blob([content],{type});
  const url=URL.createObjectURL(file), link=document.createElement('a');
  link.href=url;link.download=name;link.hidden=true;document.body.append(link);
  try{link.click()}finally{link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
}
const fname=()=>(S.date||'').split('.').reverse().join('-')+'_'+rinkOrder(S.venue,S.home,S.away).join('_');
function csv(){const keep=UI.sumPer,out=[];
  for(const [p,l] of [['all','Матч'],[0,'1–2 пер. (не разделено)'],[1,'1 период'],[2,'2 период'],[3,'3 период'],[4,'ОТ']]){if(p!=='all'&&!S.ev.some(e=>e.p===p))continue;UI.sumPer=p;
    for(const x of ord(true).filter(p=>!p.out||S.ev.some(e=>e.n===p.n))){const s=st(x.n);out.push([l,x.n,x.name,x.pos,s.fw,s.fl,s.sh,s.g,s.a,s.bl,s.hit,s.to,s.pen,s.pmc?s.pl:'',s.pmc?s.mi:''].join(';'))}}
  UI.sumPer=keep;dl(fname()+'.csv','﻿Часть;№;Игрок;Амплуа;Выиграл вбр.;Проиграл вбр.;Броски;Голы;Передачи;Заблокировал;Силовые;Потери;Штраф, мин;Плюсы;Минусы\n'+out.join('\n'),'text/csv')}

const HINTS=[['.acts','Увидели действие на льду — нажмите его здесь, например «Бросок».'],
  ['.tiles','Потом нажмите номер игрока. Всё — записано. Можно и наоборот: сначала номер, потом действие.'],
  ['.feed','Ошиблись — нажмите × у записи в этом списке или «Отменить последнее». Ничего не потеряется.'],
  ['#strip','Здесь видно, сколько игроков на льду. Удаление меняет это само; когда штраф закончится — нажмите «Штраф закончился».']];
function coach(i){document.querySelectorAll('.coach,.ring').forEach(x=>x.remove());if(UI.tab!=='input'){UI.tab='input';render()}
  if(i>=HINTS.length){try{localStorage.setItem('lm_hints','1')}catch(_){}return}
  const el=document.querySelector(HINTS[i][0]);if(!el)return;const r=el.getBoundingClientRect();
  const ring=document.createElement('div');ring.className='ring';Object.assign(ring.style,{left:r.left-4+'px',top:r.top-4+'px',width:r.width+8+'px',height:r.height+8+'px'});
  const c=document.createElement('div');c.className='coach';c.innerHTML=`${HINTS[i][1]}<br><button>${i<HINTS.length-1?'Понятно, дальше':'Понятно'}</button><small>Подсказка ${i+1} из ${HINTS.length}</small>`;
  document.body.append(ring,c);const cw=340;let x=r.right+16,y=r.top;if(x+cw>innerWidth){x=Math.max(16,r.left-cw-16)}if(x<16||(r.width>innerWidth*.6)){x=Math.min(innerWidth-cw-16,r.left+20);y=r.bottom+16}
  Object.assign(c.style,{left:x+'px',top:Math.min(y,innerHeight-200)+'px'});c.querySelector('button').onclick=()=>coach(i+1)}

/* ---------- события ---------- */
document.addEventListener('click',e=>{if(!VIEW&&e.target.closest('#home,#away')&&!ov.classList.contains('on')){rosterSheet();return}
  if(UI.sog!=null&&!e.target.closest('button,.pop')){UI.sog=null;render();return}
  if(UI.pl&&!UI.act&&UI.tab==='input'&&!ov.classList.contains('on')&&!e.target.closest('button,.pop')){UI.pl=null;render();return}
  const b=e.target.closest('button');if(!b||ov.contains(b))return;const d=b.dataset;
  if(VIEW&&!(d.tab||d.th||d.sp!=null||d.sv||d.sm||'print' in d||b.id==='menuB'))return;
  if(d.gk){record('sv',+d.gk);return}
  if('gkswap' in d){const old=S.gk.slice(),a=gk0(),b2=S.gk.find(g=>g&&g.n!==a.n);S.gk=[b2,a];UI.act=UI.pl=null;save();render();snack('В воротах '+b2.n+' '+b2.name+' — дальше считаю ему','Вернуть',()=>{S.gk=old;save();render()});return}
  if(d.sog){UI.sog=UI.sog===+d.sog?null:+d.sog;UI.act=UI.pl=null;render();return}
  if(d.so){const g=(UI.sog!=null&&(S.gk||[]).find(x=>x&&x.n===UI.sog))||gk0(),gid=S.nextId;UI.sog=null;push(gid,d.so==='bsv'&&g?g.n:null,d.so,g?{gk:g.n}:{});UI.lastGid=gid;UI.act=UI.pl=null;save();render();snack('Записано: '+AN[d.so].toLowerCase(),'Отменить',()=>delGroup(gid));return}
  if('soend' in d){S.soEnd=!S.soEnd;save();render();return}
  if(d.act){choose(d.act,null);return} if(d.pl){choose(null,+d.pl);return}
  if(d.del){delGroup(+d.del);return} if(d.eg){const gid=+d.eg,e=S.ev.find(x=>x.gid===gid&&(x.k==='g'||x.k==='ga'));if(e)goalSheet(e.k==='g',null,gid);return} if(b.id==='undoB'){undoLast();return}
  if(d.tab){UI.tab=d.tab;render();if(d.tab==='season')loadSeason();return}
  if(d.sm){SEASON.mode=d.sm;seasonScreen.firstPage();render();return} if(d.th){UI.theme=d.th;document.documentElement.dataset.theme=d.th;try{localStorage.setItem('lm_theme',d.th)}catch(_){}render();return}
  if(d.sp!=null){UI.sumPer=d.sp==='all'?'all':+d.sp;render();return} if(d.sv){UI.sumView=d.sv;render();return} if('print' in d){window.print();return}
  if(d.pend){endPen(d.pend);return} if('opp' in d){oppPenSheet();return} if(d.pull){S.pull[d.pull]=!S.pull[d.pull];save();render();return}
  if(b.id==='pPrev'){S.cur=Math.max(1,S.cur-1);save();render();return} if(b.id==='pNext'){perNext();return}
  if(b.id==='menuB'){menuSheet();return}});

const KM={KeyS:'sh',KeyQ:'fw',KeyW:'fl',KeyB:'bl',KeyH:'hit',KeyL:'to',KeyP:'pen'};let buf='',bufT;
document.addEventListener('keydown',e=>{
  if(ov.classList.contains('on')){if(e.key==='Escape')close_();else if(sh.onkey)sh.onkey(e);return}
  if(/INPUT|TEXTAREA/.test(e.target.tagName)||VIEW||UI.tab==='season')return;
  if((e.metaKey||e.ctrlKey)&&e.code==='KeyZ'){e.preventDefault();undoLast();return} if(e.metaKey||e.ctrlKey)return;
  if(e.key==='Escape'){UI.act=null;UI.pl=null;UI.sog=null;buf='';render();return}
  if(e.key==='ArrowLeft'){S.cur=Math.max(1,S.cur-1);save();render();return} if(e.key==='ArrowRight'){perNext();return}
  if(e.code==='KeyG'){if(S.cur!==5)goalSheet(!e.shiftKey);return}
  if(KM[e.code]&&UI.tab==='input'){choose(KM[e.code],null);return}
  if(/^Digit\d$/.test(e.code)&&UI.tab==='input'){buf+=e.code.slice(5);clearTimeout(bufT);
    const n=+buf, longer=ord().some(p=>String(p.n).startsWith(buf)&&String(p.n)!==buf);
    const on=x=>ord().some(p=>p.n===x);
    if(on(n)&&!longer){buf='';choose(null,n)} else bufT=setTimeout(()=>{if(on(+buf))choose(null,+buf);buf=''},700)}
});
