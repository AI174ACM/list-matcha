<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лист матча · отчёт</title>
<!-- Отчёт о периоде и об игре. Открывается внутри программы (вкладка «Отчёт» в index.html), матч получает сообщением.
     Оформление — брендбук кабинета («Управление хоккейным бизнесом», tokens_v1.css + components_v1.css), вставлен как есть. -->
<style>
/* Брендбук «Трактор · кабинет директора»: tokens_v1.css и components_v1.css вставлены как есть (одна тёмная тема, системный шрифт). */
/* =====================================================================
   tokens_v1.css · «Трактор · кабинет директора» · 31.10.2026
   Одна тёмная тема (канон 16г: тёмная везде, Mac и телефон), системный SF,
   тревога — графит с оранжевым отсветом + знак «!» + слово; красного, бордо,
   розового, зелёного и синего нет нигде (канон 26).
   Имена переменных — те же, что в kabinet.html (блок :root[data-theme="dark"]),
   плюс новые: --verdict-*, --alert*, --space-*, --fs-*, --mono, --r3.

   ПОДКЛЮЧЕНИЕ: отдельным <style id="tokens-v1"> ПОСЛЕ основного <style>
   kabinet.html (или <link> после него). Не вклеивать в первый <style>:
   экспорт карточки игрока берёт document.querySelector('style') и ставит
   data-theme="light" — бумага должна остаться светлой. Селектор ниже
   намеренно не срабатывает на [data-theme="light"].

   Контраст — WCAG 2.1 к карточке --surface #1C1C1E (в скобках — к --raised
   #2C2C2E и к фону #000). AA: текст 4,5:1, крупные цифры ≥ 24 px — 3:1.
   ===================================================================== */
:root{
  color-scheme:dark;

  /* ---------- 1. Плоскости ---------- */
  --bg:#000000;        /* фон за карточками; body, .top, .side, .tabbar */
  --bg2:#1C1C1E;       /* вторая плоскость (поля ввода, лист); = surface */
  --surface:#1C1C1E;   /* карточка, модуль, плитка, лист: .card .dd .mod .tile .sheet */
  --raised:#2C2C2E;    /* подложка знака, кнопка 2, плитка внутри карточки, .tile старый, .btn.sec */
  --line:#2E2E31;      /* линия между строками таблиц; карточки рамок не имеют (группы — воздухом) */
  --line2:#48484A;     /* сильная линия: шкалы, середина .stm-scale, ручка листа */
  --fill:rgba(118,118,128,.20);   /* подложка чипа, .gt, полос шкал */
  --fill2:rgba(118,118,128,.36);  /* выбранная строка меню .sb-r[aria-current] */
  --sel:#3A3A3C;       /* выделение в списках/таблицах */
  --side:rgba(28,28,30,.86);      /* боковая колонка (Mac) */
  --bar:rgba(0,0,0,.78);          /* верхняя полоса и нижняя панель (телефон) */
  --logo-bg:#F2F2F4;   /* светлая подложка логотипов клубов: у многих логотипов тёмные края */
  --logo-pad:2px;

  /* ---------- 2. Текст ---------- */
  --text:#F5F5F7;      /* основной текст и значения; 15,6 (12,8 / 19,3) */
  --muted:#AEAEB2;     /* подписи 13 px; 7,7 (6,3) */
  --faint:#98989D;     /* источник и время данных 12 px; 5,9 (4,9). Было #8E8E93 — 5,2/4,3, на #2C2C2E не проходило */
  --deep:#FFFFFF;      /* самый яркий текст (в kabinet не используется, оставлен для совместимости) */

  /* ---------- 3. Нейтральные роли (в тёмной — светлый графит) ---------- */
  --team:#F5F5F7;      /* «наш»: номер на фото, обводка фокуса; 15,6 */
  --team-soft:rgba(255,122,47,.20); /* подложка домашнего матча .gt.home — оранжевый отсвет на графите */
  --team-ink:#1D1D1F;  /* текст на --team; 16,8 */
  --accent:#F5F5F7;    /* .btn (обычная), выбранный чип, вкладка; НЕ оранжевый — иначе каждая кнопка станет «главной» */
  --accent-soft:rgba(118,118,128,.24); /* текущий пункт .snav */
  --accent-ink:#1D1D1F;/* текст на .btn; 16,8 */
  --ink:#F5F5F7;       /* «хорошо» = светлый графит + вес шрифта */
  --ink-soft:#2C2C2E;
  --us:linear-gradient(90deg,#F5F5F7,#AEAEB2); /* полоса «мы» в сравнениях .vs .pbar .capbar */

  /* ---------- 4. Акцент клуба (оранжевый) ---------- */
  --hl:#FF7A2F;        /* знак «открыть», кольца, точка «лучшее», оранжевая деталь иллюстраций, цифры ≥ 24; 6,5 (5,4) */
  --hl-soft:rgba(255,122,47,.22);   /* подложка оранжевого знака */
  --hl-ink:#FFFFFF;    /* стрелка «открыть» при наведении (на оранжевом кружке) */
  --tint:#FF7A2F;      /* значки меню .sb-r svg, счётчик .sb-r .cnt */
  --tint-fg:#FF8D4D;   /* оранжевый текст-ссылка «лист матча →», активная вкладка нижней панели; 7,4 (6,1) */
  --tint-soft:rgba(255,122,47,.22);
  --hi:#FF7A2F;        /* подсветка (в kabinet не используется) */
  --gold:#FF7A2F;      /* «лучшее/элита»: .flag.elite, .range .dot, .verdict.gold; золота нет — это оранжевый клуба */
  --gold-soft:rgba(255,122,47,.20);

  /* ---------- 5. Статусы: без зелёного, синего, красного ---------- */
  --good:#F5F5F7;      /* «хорошо»: победа .cal .res.w, «в плей-офф», рост; светлый графит + вес; 15,6 */
  --good-soft:#2C2C2E;
  --warn:#FF9F5A;      /* «внимание» и «рост» (.sw-t.up, .pill.warn): светлый янтарь, светлее акцента (L* 74 против 66); 8,4 (6,9) */
  --warn-soft:rgba(255,122,47,.18);
  --crit:#E9B48C;      /* «плохо»/тревога: поражение, срок контракта истёк, травма, «мимо плей-офф».
                          БЫЛ КРАСНЫЙ #FF453A. Теперь «пепел с оранжевым отсветом»: тёплый светлый графит, тон 26°
                          (не розовый, не бордо). 9,2 (7,5). Отличие: от акцента ΔE 48, от «хорошо» ΔE 37 и по светлоте
                          (L* 77 / 66 / 97) — различим при дейтеранопии и протанопии по светлоте.
                          Цвет только подкрашивает: тревогу несут знак «!» (--alert) и слово. */
  --crit-soft:#3A2A21; /* подложка тревоги = графит с оранжевым отсветом (бывшая rgba красного .18);
                          текст на ней 12,6, оранжевый знак на ней 5,3 */
  --crit-ink:#1D1D1F;  /* НОВАЯ: текст на заливке --crit (.fr-pill.bad, .fr-s.bad — там сейчас #fff, 2,0 → 9,1) */
  --info:#D1D1D6;      /* справка: .pill.info; 11,2 */
  --info-soft:#2C2C2E;
  --demo:#98989D;      /* метка «демо»; 5,9 */
  --demo-soft:rgba(142,142,147,.20);

  /* ---------- 6. Тревога (новые) ---------- */
  --alert:#FF7A2F;     /* цвет знака тревоги: ромб «!» и обводка; на --crit-soft 5,3, на #2C2C2E 5,4 */
  --alert-soft:#3A2A21;/* подложка знака «!» и строки тревоги (= --crit-soft) */
  --alert-ink:#F5F5F7; /* слово тревоги рядом со знаком — светлый текст + вес 600 */

  /* ---------- 7. Плашка-вердикт (новые) ---------- */
  --verdict-grad:radial-gradient(42% 34% at 86% 12%,rgba(255,150,80,.55),rgba(255,150,80,0) 70%),
                 linear-gradient(180deg,#C94F0E 0%,#D9530C 28%,#A9420C 50%,#4A2412 72%,#1C1C1E 94%);
                       /* обычная плашка; цифра белая: 4,6 на #C94F0E, 4,0 на #D9530C (крупная, ≥ 3:1);
                          слово и фраза стоят ниже 72 % — на #4A2412…#1C1C1E: текст 12,4, приглушённый 6,1 */
  --verdict-alert:radial-gradient(46% 38% at 88% 10%,rgba(255,122,47,.42),rgba(255,122,47,0) 72%),
                  linear-gradient(180deg,#3A3A3C 0%,#2E2E30 46%,#242426 72%,#1C1C1E 94%);
                       /* тревожная плашка: графит с оранжевым отсветом справа сверху; белая цифра 11,3–15,6 */
  --verdict-ink:#FFFFFF;
  --verdict-band:168px;/* высота цветной части плашки (Mac); телефон — 150 */

  /* ---------- 8. Шкалы и серии ---------- */
  --s1:#F5F5F7; --s2:#FF7A2F; --s3:#8E8E93; --s4:#FF9F5A;
  --s5:#E9B48C;        /* была красная #FF453A */
  --s6:#636366; --prev:#48484A;
  --sc1:#E9B48C;       /* шкала 1 (хуже всего): была #FF453A */
  --sc2:#48484A; --sc3:#8E8E93; --sc4:#F5F5F7;
  --sc5:#FF7A2F;       /* шкала 5 (лучше всего) */
  --sc1-ink:#1D1D1F;   /* был #FFFFFF: на #E9B48C белый 1,8, графит 9,1 */
  --sc2-ink:#F5F5F7; --sc3-ink:#1D1D1F; --sc4-ink:#1D1D1F;
  --sc5-ink:#1D1D1F;   /* был #FFFFFF (2,6); графит на #FF7A2F 6,5 */
  --t-khl:#FF7A2F; --t-vhl:#F5F5F7; --t-mhl:#636366; /* метки лиг */

  /* ---------- 9. Глубина ---------- */
  --hero:radial-gradient(60% 90% at 100% 0%,rgba(255,122,47,.24),rgba(255,122,47,0) 62%),linear-gradient(160deg,#2C2C2E,#1C1C1E);
                       /* .hero и .cc.big (белый текст): графит с отсветом вместо серого градиента */
  --shadow:0 16px 48px rgba(0,0,0,.6);  /* лист, всплывающее */
  --shadow-s:0 0 0 rgba(0,0,0,0);       /* карточки теней не имеют */

  /* ---------- 10. Шрифт: системный SF (вариант C) ---------- */
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace; /* цифры «табло» в модуле и плитке */
  --fs-hero:64px;      /* цифра плашки-вердикта (телефон 64, Mac 72 — в components) */
  --fs-verdict:34px;   /* слово-вердикт, заголовок экрана */
  --fs-num:32px;       /* главная цифра карточки/модуля */
  --fs-num-xl:44px;    /* одна цифра на всю карточку (без графика) */
  --fs-h:17px;         /* заголовок карточки, группы */
  --fs-body:15px;      /* фраза вердикта, текст */
  --fs-sub:13px;       /* подпись под цифрой */
  --fs-src:12px;       /* источник, время данных, статус словом */
  --fs-unit:11px;      /* единица в плитке */
  --lh-tight:1.05; --lh-text:1.45;
  --track-num:-.03em; --track-h:-.02em;

  /* ---------- 11. Воздух ---------- */
  --space-1:4px;   /* цифра → подпись */
  --space-2:8px;   /* знак → текст; плитка → плитка */
  --space-3:12px;  /* модуль → модуль (телефон) */
  --space-4:16px;  /* поле телефона; модуль → модуль (Mac); внутри модуля */
  --space-5:24px;  /* внутри карточки (Mac), внутри плашки */
  --space-6:32px;  /* группа → группа (межблочный) */
  --space-7:48px;  /* раздел → раздел; поле Mac */
  --space-8:64px;  /* шапка раздела → первый блок на Mac 1600 */

  /* ---------- 12. Скругления ---------- */
  --r:20px;        /* карточка, модуль */
  --r2:12px;       /* кнопка, знак-подложка */
  --r3:24px;       /* плашка-вердикт, шапка раздела */
}

/* =====================================================================
   components_v1.css · паттерны брендбука v1 поверх tokens_v1.css · 31.10.2026
   Подключать ПОСЛЕ tokens_v1.css и после основного <style> kabinet.html.
   Без зависимостей. Точки: телефон (база, 390–420) · 760 · Mac 1180 · 1600.
   Паттерны: .verdict (плашка) · .mod (модуль) · .tiles/.tile (плитки) ·
   .sec-hero (шапка раздела с иллюстрацией) · .fold (закрытый блок) ·
   .st (статус словом) · .alert-mark (ромб «!») · .open (знак «открыть») ·
   .btn.go (одна кнопка действия) · воздух (.card, .sec, .stack).
   Совместимость: в kabinet уже есть .verdict (кольцо в карточке игрока),
   .tile/.tiles (раздел «Лиги»), .card, details.dd — см. блок 9.
   ===================================================================== */

/* ---------- 0. Общие знаки ---------- */
.open{flex:none;width:24px;height:24px;border-radius:50%;background:var(--hl-soft);position:relative;display:inline-block}
.open::after{content:"";position:absolute;left:8px;top:8px;width:6px;height:6px;border-top:1.75px solid var(--hl);border-right:1.75px solid var(--hl);transform:rotate(45deg)}
.alert-mark{flex:none;position:relative;display:inline-grid;place-items:center;width:18px;height:18px;vertical-align:-3px}
.alert-mark::before{content:"";position:absolute;inset:3px;border:1.75px solid var(--alert);background:var(--alert-soft);border-radius:2px;transform:rotate(45deg)}
.alert-mark::after{content:"!";position:relative;font:700 11px/1 var(--body);color:var(--alert)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-src);line-height:16px;font-weight:600;color:var(--muted);white-space:nowrap}
.st::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;box-sizing:border-box}
.st.best{color:var(--text)}            .st.best::before{background:var(--hl)}
.st.mid::before{border:1.75px solid var(--muted)}
.st.early{color:var(--faint)}          .st.early::before{border:1.5px dashed var(--faint)}
.st.weak{color:var(--alert-ink)}       .st.weak::before{display:none}
.st.weak .alert-mark{width:16px;height:16px}
.btn.go,.vd-btn{border:0;border-radius:var(--r2);padding:11px 18px;font:600 15px/20px var(--body);background:var(--hl);color:#1D1D1F;cursor:pointer}  /* графит на оранжевом 6,5 */
.btn.go2,.vd-btn2{border:0;border-radius:var(--r2);padding:11px 16px;font:600 15px/20px var(--body);background:var(--raised);color:var(--text);cursor:pointer}

/* ---------- 1. Плашка-вердикт ---------- */
/* <section class="verdict [alert]"><div class="vd-band"><div class="vd-top"><span class="vd-kick">…</span><span class="vd-time">…</span></div>
   <div class="vd-num">5<small>из 9</small></div></div><div class="vd-body"><div class="vd-word">…</div><p class="vd-phrase">…</p>
   <div class="vd-act"><button class="vd-btn">…</button><button class="vd-btn2">…</button></div><div class="vd-src">…</div></div></section> */
.verdict{position:relative;display:block;padding:0;border:0;border-radius:var(--r3);overflow:hidden;background:var(--surface);box-shadow:none;color:var(--text)}
.verdict .vd-band{position:relative;height:150px;background:var(--verdict-grad)}
.verdict.alert .vd-band,.verdict.crit:not(:has(>.v-ring)) .vd-band{background:var(--verdict-alert)}
.verdict .vd-top{position:absolute;left:20px;right:20px;top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:var(--fs-sub);line-height:18px;color:rgba(255,255,255,.86)}
.verdict .vd-kick{display:inline-flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.verdict .vd-kick svg{width:18px;height:18px;flex:none;color:#fff}
.verdict .vd-time{font-size:var(--fs-src);padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.16);white-space:nowrap}
.verdict .vd-num{position:absolute;left:20px;top:46px;font:700 var(--fs-hero)/1 var(--display);letter-spacing:-.045em;color:var(--verdict-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.verdict .vd-num small{font-size:.42em;font-weight:600;letter-spacing:-.01em;opacity:.72;margin-left:8px}
.verdict .vd-body{position:relative;margin-top:-30px;padding:0 20px 20px}
.verdict .vd-word{display:flex;align-items:center;gap:10px;font:700 28px/1.1 var(--display);letter-spacing:-.025em;color:var(--text);text-wrap:balance}
.verdict .vd-word .alert-mark{width:24px;height:24px}
.verdict .vd-word .alert-mark::after{font-size:13px}
.verdict .vd-phrase{margin:var(--space-2) 0 0;font-size:var(--fs-body);line-height:22px;color:var(--muted);max-width:52ch;text-wrap:pretty}
.verdict .vd-act{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-4)}
.verdict .vd-src{margin-top:var(--space-3);font-size:var(--fs-src);line-height:16px;color:var(--faint)}

/* ---------- 2. Модуль: знак + подпись + цифра + мини-график + статус ---------- */
/* <button class="mod"><div class="mod-lab"><span class="mod-ic">svg</span><span class="t">Подпись</span><span class="open"></span></div>
   <div class="mod-v">51,1<small>%</small></div><svg class="mod-g" viewBox="0 0 132 48">…</svg><span class="st best">сильная сторона · 4-е</span></button> */
.mods{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-3)}
.mod{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr auto;column-gap:var(--space-4);min-height:128px;
  width:100%;text-align:left;font:inherit;color:inherit;border:0;border-radius:var(--r);background:var(--surface);padding:16px 16px 16px 20px;cursor:pointer}
.mod-lab{grid-column:1/3;display:flex;align-items:center;gap:var(--space-2);font-size:var(--fs-sub);line-height:18px;color:var(--muted);min-width:0}
.mod-lab .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mod-ic{flex:none;width:24px;height:24px;border-radius:7px;background:var(--raised);display:grid;place-items:center;color:var(--text)}
.mod-ic svg{width:16px;height:16px}
.mod-v{grid-column:1;align-self:end;margin-top:var(--space-3);font:700 var(--fs-num)/1.1 var(--mono);letter-spacing:-.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
.mod-v small{font:500 15px/1 var(--body);letter-spacing:0;color:var(--muted);margin-left:4px}
.mod-g{grid-column:2;grid-row:2/4;align-self:end;width:132px;height:48px;overflow:visible;color:var(--muted)}
.mod-g .ln{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.mod-g .base{stroke:var(--line2);stroke-width:1;stroke-dasharray:2 3}
.mod-g .end{fill:var(--hl)}            /* последняя точка повторяет знак статуса */
.mod-g .end.mid{fill:var(--surface);stroke:var(--muted);stroke-width:1.75}
.mod-g .end.weak{fill:var(--alert-soft);stroke:var(--alert);stroke-width:1.75}
.mod-g .us{fill:var(--text)} .mod-g .them{fill:var(--line2)}
.mod .st{grid-column:1;margin-top:var(--space-1)}
.mod:focus-visible{outline:2px solid var(--hl);outline-offset:2px}

/* ---------- 3. Ряд плиток с единицей ---------- */
/* <div class="tiles"><div class="tile"><svg>…</svg><b class="v">41<small>гол</small></b><span class="d">забито</span></div>…</div>
   Совместимо со старой разметкой «Лиг»: .tile > .eyebrow + .v(small) + .d */
.tiles{display:grid;grid-template-columns:repeat(var(--tn,5),minmax(0,1fr));gap:var(--space-2)}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;text-align:center;background:var(--surface);border:0;border-radius:16px;padding:12px 6px 10px}
.tile>svg{width:16px;height:16px;color:var(--muted);margin-bottom:4px}
.tile .v{display:block;font:700 17px/22px var(--mono);letter-spacing:-.03em;white-space:nowrap;color:var(--text)}
.tile .v small{font:500 var(--fs-unit)/1 var(--body);letter-spacing:0;color:var(--muted);margin-left:2px}
.tile .d,.tile .eyebrow{display:block;max-width:100%;font-size:var(--fs-unit);line-height:14px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .eyebrow{order:3}

/* ---------- 4. Шапка раздела с иллюстрацией ---------- */
/* <header class="sec-hero"><div class="sh-art">[svg 120×80]</div><div class="sh-txt"><div class="sh-kick">Подготовка</div>
   <h1>Соперник</h1><p>Одна строка: что здесь и зачем.</p></div><div class="sh-stamp">данные 31.10, 12:15</div></header> */
.sec-hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-3);padding:var(--space-4) var(--space-4) var(--space-5);
  border-radius:var(--r3);background:radial-gradient(70% 90% at 0% 0%,rgba(255,122,47,.10),rgba(255,122,47,0) 60%),var(--surface);overflow:hidden}
.sh-art{width:132px;height:88px;color:#C7C7CC}     /* штрих иллюстрации — светлый графит, 10,1 к #1C1C1E */
.sh-art svg{display:block;width:100%;height:100%;overflow:visible}
.sh-kick{font-size:var(--fs-sub);line-height:18px;color:var(--muted)}
.sec-hero h1{margin:2px 0 0;font:700 var(--fs-verdict)/40px var(--display);letter-spacing:-.03em;color:var(--text)}
.sec-hero p{margin:var(--space-2) 0 0;font-size:var(--fs-body);line-height:22px;color:var(--muted);max-width:56ch}
.sh-stamp{position:absolute;right:var(--space-4);top:var(--space-4);font-size:var(--fs-src);line-height:16px;color:var(--faint);padding:3px 10px;border-radius:999px;background:var(--raised);white-space:nowrap}

/* ---------- 5. Закрытый блок (итог в заголовке) ---------- */
/* <details class="fold"><summary><span class="fold-ic">svg</span><span class="fold-t"><b>Заголовок</b><span>итог словами</span></span>
   <span class="fold-n">23<small>строки</small></span><span class="fold-chev"></span></summary><div class="fold-body">…</div></details> */
.fold{border-radius:var(--r);background:var(--surface);overflow:hidden}
.fold>summary{list-style:none;display:flex;align-items:center;gap:var(--space-3);min-height:64px;padding:12px 16px 12px 16px;cursor:pointer}
.fold>summary::-webkit-details-marker{display:none}
.fold-ic{flex:none;width:32px;height:32px;border-radius:9px;background:var(--raised);display:grid;place-items:center;color:var(--text)}
.fold-ic svg{width:18px;height:18px}
.fold-t{flex:1;min-width:0}
.fold-t b{display:block;font:600 var(--fs-h)/22px var(--display);letter-spacing:-.01em;color:var(--text)}
.fold-t span{display:block;font-size:var(--fs-sub);line-height:18px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-n{flex:none;font:700 17px/22px var(--mono);letter-spacing:-.03em;color:var(--text)}
.fold-n small{font:500 var(--fs-unit)/1 var(--body);color:var(--muted);margin-left:3px;letter-spacing:0}
.fold-chev{flex:none;width:24px;height:24px;position:relative}
.fold-chev::after{content:"";position:absolute;left:7px;top:6px;width:7px;height:7px;border-right:1.75px solid var(--muted);border-bottom:1.75px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.fold[open] .fold-chev::after{transform:translate(0,4px) rotate(-135deg)}
.fold-body{padding:0 16px 16px;border-top:1px solid var(--line)}
.fold-body>:first-child{margin-top:var(--space-4)}

/* ---------- 6. Карточка-цифра: одна цифра — одна подпись — одна пустая зона ---------- */
.figure{display:flex;flex-direction:column;justify-content:flex-end;min-height:132px;padding:20px;border-radius:var(--r);background:var(--surface)}
.figure .fg-v{font:700 var(--fs-num-xl)/1 var(--display);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.figure .fg-v small{font:600 17px/1 var(--body);color:var(--muted);letter-spacing:0;margin-left:6px}
.figure .fg-l{margin-top:var(--space-1);font-size:var(--fs-sub);line-height:18px;color:var(--muted)}

/* ---------- 7. Воздух ---------- */
/* Правило: группы отделяются воздухом, не рамкой. Внутри карточки 20 (телефон) / 24 (Mac); между блоками 32; между разделами 48. */
.card{background:var(--surface);padding:20px;border:0;border-radius:var(--r);box-shadow:none}
.card.tight{padding:16px}
.stack>*+*{margin-top:var(--space-6)}          /* вертикальный поток блоков */
.stack-s>*+*{margin-top:var(--space-3)}        /* внутри группы */
.sec+.sec{margin-top:var(--space-6)}
.grp-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-3);margin:0 0 var(--space-3)}
.grp-h h2{font:600 var(--fs-h)/22px var(--display);letter-spacing:-.01em;margin:0}
.grp-h .src{font-size:var(--fs-src);color:var(--faint)}

/* ---------- 8. Адаптивность ---------- */

  .mods{grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
  .tiles{--tn:6}
  .sec-hero{grid-template-columns:200px minmax(0,1fr);align-items:center;gap:var(--space-5);padding:var(--space-5)}
  .sh-art{width:200px;height:133px}
  .sh-stamp{right:var(--space-5);top:var(--space-5)}
}
@media (min-width:1180px){

}

}
@media (max-width:420px){
  .tiles{gap:6px;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(62px,1fr);overflow-x:auto;scrollbar-width:none}  /* один ряд; больше 5 — прокрутка вбок */
  .tile{padding:10px 4px 8px}

/* ---------- 9. Совместимость со старой разметкой kabinet.html (мост на время пересборки) ---------- */
/* старый вердикт игрока: кольцо + слово в карточке (.verdict > .v-ring) — оставить карточкой, без плашки */
.verdict:has(>.v-ring){display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-4);align-items:center;padding:20px;border-radius:var(--r);background:var(--surface)}
.verdict.crit:has(>.v-ring),.verdict.gold:has(>.v-ring),.verdict.ink:has(>.v-ring){box-shadow:none}
.verdict.crit:has(>.v-ring) .v-word::before{content:"!";display:inline-grid;place-items:center;width:20px;height:20px;margin-right:8px;border-radius:5px;
  background:var(--alert-soft);color:var(--alert);font:700 13px/1 var(--body);vertical-align:3px}
/* тревожные полосы слева (inset 4px var(--crit)) — убрать: тревога знаком, не полосой */
.cc.crit,.verdict.crit,details.dd.p1,.wh .row.p1{box-shadow:none}
/* белый текст на заливке --crit → графит */
.fr-pill.bad,.fr-s.bad{color:var(--crit-ink)}
/* старые плитки в «Лигах» стоят парами — дать им ряд */
.tiles:has(>.tile>.eyebrow){--tn:2}
@media (min-width:760px){.tiles:has(>.tile>.eyebrow){--tn:4}}

<script>
/* Отчёт «Листа матча»: после периода и за всю игру. Страница живёт во вкладке «Отчёт» программы (index.html)

let D=null,view=null;

const PNAME=p=>p===4?'Овертайм':p+'-й период', PSHORT=p=>p===4?'ОТ':p+'-й';
const per=e=>e.p===0?2:e.p;                         // записи с бумажного листа без периода (встроенный пример) считаются с начала матча начиная со 2-го периода

const IC={sh:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/>',fo:'<circle cx="12" cy="12" r="8"/><path d="M12 4v16"/>',to:'<path d="M6 9h11l-3-3M18 15H7l3 3"/>',bl:'<path d="M12 4l7 3v5c0 4-3 7-7 8-4-1-7-4-7-8V7z"/>',ls:'<path d="M5 7h14M5 12h14M5 17h9"/>',pe:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/>',col:'<path d="M5 19V9M12 19V5M19 19v-7"/>'};

const ART=`<svg viewBox="0 0 240 160" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="14" y="20" width="212" height="120" rx="44"/><path d="M120 20v120M70 20v120M170 20v120" stroke-dasharray="3 6"/><circle cx="120" cy="80" r="24"/><path d="M34 62v36M206 62v36"/><circle cx="120" cy="80" r="4.5" fill="var(--hl)" stroke="none"/></svg>`;

const matchTeams=()=>hostGuest(D.home,D.away);

const hero=(kick,h)=>`<header class="sec-hero"><div class="sh-art">${ART}</div><div class="sh-txt"><div class="sh-kick">${kick}</div><h1>${h}</h1><p>${TITLE()}</p></div></header>`;
const verdict=(kick,num,word,ps)=>`<section class="verdict"><div class="vd-band"><div class="vd-top"><span class="vd-kick">${kick}</span></div><div class="vd-num">${num}</div></div><div class="vd-body"><div class="vd-word">${word}</div><div class="vd-src ps">${ps}</div></div></section>`;
const fo=(r,f)=>({a:E('fw',f,r.n),b:E('fl',f,r.n),get n(){return this.a+this.b},get q(){return pct(this.a,this.b)}});
const cenRule=x=>x.n>=8&&x.q>=60?'S':x.n>=4&&x.n<=7&&x.q>=75?'S':x.n>=10&&x.q>=50&&x.q<60?'S':x.n>=8&&x.q<=40?'C':x.n>=4&&x.n<=7&&x.q<=25?'Cп':null;
const SCORE=f=>hostGuest(
  E('g',f)+(f===ALL&&D.so==='us'?1:0),
  E('ga',f)+(f===ALL&&D.so==='them'?1:0)

/* ---------- когда цифра попадает в итоги (пороги — допущение, Антоном не утверждены) ---------- */
const RULES=[
 ['Броски к прошлому периоду','больше на 30 % и минимум на 3; или 10 бросков и больше','точка'],
 ['Вбрасывания команды за период','от 12 вбрасываний: 60 % и больше или рост на 10 пунктов','точка'],
 ['Вбрасывания команды за период','от 12 вбрасываний, 40 % и меньше','знак «!»'],
 ['Не пропустили за период','отдельно — 6 блоков и больше','точка'],
 ['Центральный с начала матча','от 8 вбрасываний и 60 % и больше; 4–7 и 75 % и больше; от 10 и 50–59 %','точка'],
 ['Центральный с начала матча','от 8 вбрасываний и 40 % и меньше; 4–7 и 25 % и меньше','знак «!»'],
 ['Звено: бросков больше всех','с начала матча 5 бросков и больше, отрыв от второго звена 2 и больше','точка'],
 ['Звено: потери','с начала матча 8 потерь и больше, 30 % потерь команды, 2 потери на бросок','знак «!»'],
 ['Мало бросков, много потерь','за период меньше 8 бросков; или 15 потерь при 2,5 на бросок','знак «!»'],
 ['Удаления','с начала матча 3 и больше и пропущено в меньшинстве','знак «!»'],
 ['Броски от защитников','с начала матча 10 бросков и больше, доля защитников 45 % и больше','знак «!»'],
 ['Нападающие без броска','нападающий 1–2-го звена без броска после двух периодов','знак «!»'],
 ['Потери игрока','с начала матча 4 и больше и 10 % потерь команды','знак «!»']];
function findings(p,m){   // m — лист «Вся игра»: строки про один период подписываются его названием
  const pp=m?PNAME(p)+' · ':'';
  return findings0(p,pp,m)}
function findings0(p,pp,m){   // p — номер периода: итоги по записям этого периода и с начала матча

  if(prev){const b=E('sh',inP(p-1));if((sh>=b*1.3&&sh-b>=3)||sh>=10)K.push(`${pp}Броски: было ${b}, стало ${sh}`)}
  else if(sh>=10)K.push(m?`${pp}Броски: ${sh}`:`Броски за период: ${sh}`);
  if(prev){const a0=E('fw',inP(p-1)),n0=a0+E('fl',inP(p-1)),q0=pct(a0,n0-a0),q=pct(fw,fl);
    if(fw+fl>=12&&(q>=60||(n0>=12&&q-q0>=10)))K.push(`${pp}Вбрасывания: было ${a0} из ${n0}, стало ${fw} из ${fw+fl}`)}

  if(ga===0)K.push(`${pp}Не пропустили${bl>=6?`. Заблокировано бросков: ${bl}`:''}`);
  for(const z of cen)if(z.rule==='S')K.push(`${esc(z.r.name)} на вбрасываниях: ${z.x.a} из ${z.x.n} с начала матча`);
  const ls=LINES().map(l=>({l,sh:cL('sh',l,fm),to:cL('to',l,fm)})),bySh=[...ls].sort((a,b)=>b.sh-a.sh);
  if(bySh.length>1&&bySh[0].sh>=5&&bySh[0].sh-bySh[1].sh>=2)K.push(`${bySh[0].l}-е звено: бросков больше всех, ${bySh[0].sh} из ${E('sh',fm)}`);
  if(K.length<2&&best&&!K.some(k=>k.includes(esc(best.r.name))))K.push(`Лучший на вбрасываниях: ${esc(best.r.name)}, ${best.x.a} из ${best.x.n}`);
  const teamLow=fw+fl>=12&&pct(fw,fl)<=40;let low=false;
  for(const z of cen){const x=z.x;
    if(z.rule==='C')C.push(`${esc(z.r.name)} на вбрасываниях: ${x.a} из ${x.n} с начала матча`);
    if(z.rule==='Cп'){C.push(`${teamLow?`Вбрасывания: ${fw} из ${fw+fl}. `:''}${esc(z.r.name)}: ${x.a} из ${x.n}`);low=true}}
  if(teamLow&&!low)C.push(`${pp}Вбрасывания: ${fw} из ${fw+fl}`);
  const penM=E('pen',fm),pkM=D.ev.filter(e=>e.k==='ga'&&e.pk&&fm(e)).length;
  if(penM>=3&&pkM)C.push(`Удалений с начала матча: ${penM}, в меньшинстве пропущено: ${pkM}`);
  const toM=E('to',fm);
  for(const x of ls)if(x.to>=8&&x.to/toM>=.3&&x.sh&&x.to/x.sh>=2)C.push(`${x.l}-е звено с начала матча: потери ${x.to}, броски ${x.sh}`);

const item=(t,good)=>`<div class="it"><b>${good?'<i class="gd"></i>':'<span class="alert-mark"></span>'}<span>${t}</span></b></div>`;
const sums=(F,title)=>{const g=F.K.slice(0,3).map(t=>item(t,1)).join(''),w=F.C.slice(0,4).map(t=>item(t,0)).join('');return `<div class="kcc"><h3>${title}</h3>${g||w?(g?`<div class="its-g">${g}</div>`:'')+(w?`<div class="its-g">${w}</div>`:''):'<div class="empty">записей за период пока нет</div>'}</div>`};
const LNOTE='Звенья считаются по расстановке на момент отчёта: действие записано на игрока, не на звено. Если игрока переставили в другое звено, его цифры уходят вместе с ним.';

/* расшифровка — «ведомость действий» (решение дизайнера 17.11): каждое действие — полоса во всю ширину;
   слева название и общая цифра в одном столбце у всех действий, справа игроки ровными колонками, цифра у каждой фамилии.
   Высота полосы равна содержимому: один игрок — одна строка, двадцать — пять строк по четыре. */
function decode(f,fm,m,p){
  const pn=(k,r,g)=>D.ev.filter(e=>e.k===k&&e.n===r.n&&f(e)&&(!g||g(e))).length;
  const cell=r=>`<span class="ph">${r.ph?`<img src="${esc(r.ph)}" alt="" onerror="this.remove()">`:''}</span><i>${r.n}</i><span class="nm">${esc(r.name)}</span>`;
  const row=(r,v,top,unit)=>`<li class="pl${top?' top':''}">${cell(r)}<b>${v}${unit?`<small>${unit}</small>`:''}</b></li>`;
  /* по убыванию; жирным — у кого больше всех; если у всех поровну, никто не выделяется */
  const ladder=(vals,unit)=>{const a=vals.filter(x=>x.v).sort((x,y)=>y.v-x.v||x.r.n-y.r.n);if(!a.length)return '';const lead=a[0].v>a[a.length-1].v;return `<ul class="da-l">${a.map(x=>row(x.r,x.v,lead&&x.v===a[0].v,unit)).join('')}</ul>`};
  const bar=(r,a,n,q)=>`<li class="pl bar top">${cell(r)}<em>${a} из ${n}</em><b>${q}<small>%</small></b><span class="bar"><i style="width:${Math.min(100,parseFloat(String(q).replace(',','.')))}%"></i></span></li>`;
  const wide=rows=>rows.length?`<ul class="da-l wide">${rows.join('')}</ul>`:'';
  const by=(k,g)=>R().map(r=>({r,v:pn(k,r,g)}));
  const fw=E('fw',f),fl=E('fl',f),ga=E('ga',f),g=E('g',f),pen=E('pen',f),sh=E('sh',f),shF=D.ev.filter(e=>e.k==='sh'&&f(e)&&pl(e.n)&&pl(e.n).pos==='н').length;
  const sitTxt=k=>{const n=E(k,f),c=s=>D.ev.filter(e=>e.k===k&&f(e)&&e.sit===s).length,pp_=c('pp'),pk_=c('pk'),en=c('en');
    return [['в равных составах',n-pp_-pk_-en],['в большинстве',pp_],['в меньшинстве',pk_],['пустые ворота',en]].filter(x=>x[1]).map(x=>`${x[0]} ${x[1]}`)};   /* каждый состав — своей строкой: в узкой колонке строка через точку переносилась */
  const cen=CEN().map(r=>({r,a:pn('fw',r),b:pn('fl',r)})).filter(x=>x.a+x.b).sort((x,y)=>(y.a+y.b)-(x.a+x.b)||x.r.n-y.r.n);
  const gks=D.gk.map(k=>({k,sv:D.ev.filter(e=>e.k==='sv'&&e.n===k.n&&f(e)).length,ga:D.ev.filter(e=>e.k==='ga'&&e.gk===k.n&&f(e)).length})).filter(x=>x.sv+x.ga);
  const svAll=E('sv',f),noShot=R().filter(r=>r.pos==='н'&&r.line>=1&&E('sh',fm,r.n)===0),sub=t=>`<div class="da-g">${t}</div>`;
  const so=m?D.ev.filter(e=>e.k==='bg'||e.k==='bm'):[],of=(a,n)=>`${a}<small>из ${n}</small>`,p1=(a,b)=>b?(100*a/(a+b)).toFixed(1).replace('.',','):'100';
  const onG=ladder(by('pm',e=>e.v>0)),onA=ladder(by('pm',e=>e.v<0));

   ['bl','блоки',E('bl',f),'',ladder(by('bl'))],

   ['to','потери',E('to',f),'',ladder(by('to'))],
   ['pen','удаления',pen,pen?`${mins(f)} минут штрафа`:'',ladder(R().map(r=>({r,v:mins(f,r.n)})),'мин')],
   ['g','голы и передачи',g,g?sitTxt('g'):'',(g?sub('голы')+ladder(by('g')):'')+(E('a',f)?sub('передачи')+ladder(by('a')):'')+(onG?sub('были на льду'):'')+onG],
   ['ga','пропустили',ga,ga?sitTxt('ga'):'',ga?(onA?sub('были на льду')+onA:sub('кто был на льду — не отмечено')):''],
   ['gk','вратарь отбил',svAll+ga?of(svAll,svAll+ga):0,svAll+ga?`${p1(svAll,ga)} % отбитых`:'',wide(gks.map(x=>bar(x.k,x.sv,x.sv+x.ga,p1(x.sv,x.ga))))||(svAll+ga?sub('вратарь у пропущенных шайб не отмечен'):'')],
   ...(so.length?[['so','буллиты',of(so.filter(e=>e.k==='bg').length,so.length),'забито',wide([...new Set(so.map(e=>e.n))].map(n=>{const a=so.filter(e=>e.n===n),y=a.filter(e=>e.k==='bg').length;return bar(who(n),y,a.length,pct(y,a.length-y))}))]]:[]),
   ...(p>=2&&!m&&D.ev.some(fm)&&noShot.length?[['ns','без броска с начала матча',noShot.length,'нападающие',`<ul class="da-l">${noShot.map(r=>`<li class="pl">${cell(r)}<b></b></li>`).join('')}</ul>`]]:[])];
  const full=C.filter(c=>c[4]),zero=C.filter(c=>!c[4]&&(c[0]!=='pen'||penaltyStats(f).count===0));
  return `<div class="dx">${full.map(([k,t,n,s2,b])=>`<section class="da" data-k="${k}"><header class="da-h"><span class="da-t">${t}</span><b class="da-n">${n}</b>${[].concat(s2||[]).map(x=>`<span class="da-s">${x}</span>`).join('')}</header><div class="da-w">${b}</div></section>`).join('')}</div>${zero.length?`<p class="note dzero">Не было: ${zero.map(c=>c[1]).join(' · ')}.</p>`:''}`;

let livePenalties=null;
function officialPenalties(){
  return [livePenalties,D.leaguePenalties].find(source=>source&&LeaguePenalties.fits(source,D,vpId()))||null;
}
function penaltyStats(f){
  const source=officialPenalties(),periods=D.periods.filter(p=>f({p}));
  const entries=source?source.list.filter(x=>x.side==='us'&&f(x)):[];
  const complete=source&&(f===ALL?source.complete:periods.length&&periods.every(p=>source.confirmed.includes(p)));
  return {count:entries.length|| (complete?0:'·'),minutes:entries.length||complete?entries.reduce((a,x)=>a+x.min,0):'·'};
}
function vpPenBlock(v,through){
  const source=officialPenalties(),periods=v==='m'?D.periods.filter(p=>!through||p<=through):[v];
  const entries=source?source.list.filter(x=>periods.includes(x.p)):[];
  const complete=source&&(v==='m'&&!through?source.complete:periods.every(p=>source.confirmed.includes(p)));
  const note=complete?(entries.length?'':'Удалений не было'):entries.length?'Сводка ВХЛ за выбранное время ещё не подтверждена':'Нет данных';
  const row=x=>`<li data-penalty><b>${esc(PNAME(x.p))} · ${esc(x.t)}</b> · ${esc(x.team)} · ${x.n==null?esc(x.name||'Игрок не указан'):'№'+esc(x.n)+' '+esc(x.name)} · ${esc(x.min)} мин${x.why?' · '+esc(x.why):''}${x.serve?' · отбывал '+esc(String(x.serve).replace(/^(\d)/,'№$1')):''}</li>`;
  return `<section class="league-penalties"><h3>Удаления · онлайн-протокол ВХЛ</h3>${entries.length?'<ul class="pen-list">'+entries.map(row).join('')+'</ul>':''}${note?'<p>'+note+'</p>':''}</section>`;
}
/* голы из текстовой трансляции лиги (слова Антона 19.11: «оператор не всегда успевает всех отметить или может отметить неправильно,
   а в протокол после видеопросмотра вписывают правильных») — время, счёт, кто забил, ассистенты, составы.
   Строка лиги: «23:25 | 3 | - | 0 | БОЛ | Изменение счета: | Челмет. | 58. Кондырев Кирилл | , ассистенты: | 12. Рыков Александр | , | 91. Цыплаков Глеб | В большинстве.» */
function vpGoals(html){const t=html.replace(/<script[\s\S]*?<\/script>|<style[\s\S]*?<\/style>/g,'').replace(/<[^>]+>/g,'|').replace(/&nbsp;/g,' ').replace(/\s+/g,' ').replace(/(\| ?){2,}/g,'|'),out=[],sn=x=>x.trim().split(' ')[0];
  for(const m of t.matchAll(/(\d+):(\d\d) ?\|(\d+)\|-\|(\d+)\|([А-Я]{3}) ?\|Изменение счета:\| ?([^|.]+)\. ?\|(\d+)\. ([^|]+)\|(?:, ассистенты: ?\|(\d+)\. ([^|]+)\|)?(?:, ?\|(\d+)\. ([^|]+)\|)?([^|]*)\|(В пустые ворота)?/g)){const sec=+m[1]*60+ +m[2];
    out.push({t:m[1]+':'+m[2],sec,p:Math.min(4,Math.floor((sec-1)/1200)+1),sc:m[3]+':'+m[4],team:m[6].trim(),n:+m[7],name:sn(m[8]),as:[[m[9],m[10]],[m[11],m[12]]].filter(a=>a[0]).map(a=>({n:+a[0],name:sn(a[1])})),
      sit:m[14]||/пустые ворота/i.test(m[13])?'en':m[5]==='БОЛ'?'pp':m[5]==='МЕН'?'pk':'eq'})}
  return out.sort((a,b)=>a.sec-b.sec)}
/* Отчёт считает по D.ev. Записи оператора лежат в D.ev0; голы и передачи подменяются голами лиги — по периодам и только когда у лиги их не меньше,
   чем у оператора (лига отстаёт на минуту-другую). «На льду при голе», броски и остальное остаются от оператора; за гол, которого у оператора не было, добавляется бросок. */
/* Если в другом периоде уже есть лишний ручной гол этой стороны, недостающая запись может быть тем же голом. */
function goalsByPeriodSafe(events,goals,home,kind){
  return [1,2,3,4].every(p=>events.filter(e=>e.p===p&&e.k===kind).length<=
    goals.filter(g=>g.p===p&&((g.team===home)===(kind==='g'))).length);
}
function vpApply(){
  if(!D)return;
  if(!D.ev0)D.ev0=D.ev;
  D.ev=D.ev0.filter(e=>e.k!=='pen');
  const official=officialPenalties();
  if(official)D.ev.push(...official.list.filter(x=>x.side==='us').map(x=>({k:'pen',p:x.p,n:x.n,min:x.min})));
  D.gdiff=0;D.liga=false;
  if(!VP||VP.id!==vpId()||!VP.goals)return;
  let ev=D.ev.slice(),diff=0;
  const addUs=goalsByPeriodSafe(D.ev0,VP.goals,D.home,'g'),addThem=goalsByPeriodSafe(D.ev0,VP.goals,D.home,'ga');
  for(const p of [1,2,3,4]){const L=VP.goals.filter(g=>g.p===p),us=L.filter(g=>g.team===D.home),th=L.filter(g=>g.team!==D.home),og=D.ev0.filter(e=>e.k==='g'&&e.p===p),oga=D.ev0.filter(e=>e.k==='ga'&&e.p===p).length;
    if(us.length&&(us.length===og.length||(addUs&&us.length>og.length))){
      /* отличия: сколько авторов голов и ассистентов лиги нет среди записей оператора за период (в записях отчёта гол и передачи не связаны между собой) */
      const miss=(lg,op)=>{op=op.slice();let k=0;lg.forEach(n=>{const i=op.indexOf(n);if(i<0)k++;else op.splice(i,1)});return k};
      diff+=miss(us.map(g=>g.n),og.map(e=>e.n))+miss(us.flatMap(g=>g.as.map(x=>x.n)),D.ev0.filter(e=>e.k==='a'&&e.p===p).map(e=>e.n));
      const left=og.map(e=>e.n);ev=ev.filter(e=>!((e.k==='g'||e.k==='a')&&e.p===p));
      us.forEach(g=>{ev.push({p,n:g.n,k:'g',sit:g.sit,lt:g.t});g.as.forEach(a=>ev.push({p,n:a.n,k:'a'}));const i=left.indexOf(g.n);if(i<0&&us.length>og.length)ev.push({p,n:g.n,k:'sh'});else if(i>=0)left.splice(i,1)})}
    for(let i=oga;addThem&&i<th.length;i++){const g=th[i];ev.push({p,n:null,k:'ga',sit:g.sit==='pp'?'pk':g.sit==='pk'?'pp':g.sit,...(g.sit==='pp'?{pk:1}:{})});diff++}}
  D.ev=ev;D.gdiff=diff;D.liga=true}
const vpGoalBlock=v=>{const a=VP.goals.filter(x=>v==='m'||x.p===v);
  return `<h3>голы · протокол лиги${v==='m'?'':' · за период'}</h3><p class="pens">${a.length?a.map(g=>`<span${g.team===D.home?'':' class="nd"'}><b>${g.t}</b> ${g.sc} ${g.team===D.home?`${g.n} ${esc(g.name)}${g.as.length?' ('+g.as.map(x=>esc(x.name)).join(', ')+')':''}`:`${esc(g.team)} — ${g.n} ${esc(g.name)}`}${g.sit==='pp'?' · бол.':g.sit==='pk'?' · мен.':g.sit==='en'?' · пуст. вор.':''}</span>`).join(''):'<span>голов не было</span>'}${D.gdiff+(D.ligaFix||0)?`<span class="nd">отличий от записей оператора: ${D.gdiff+(D.ligaFix||0)}</span>`:''}</p>`};
function vpLoad(force){const id=vpId();if(!id)return Promise.resolve();if(vpBusy)return id===vpRequestId?vpBusy:vpBusy.then(()=>vpId()===id?vpLoad(force):null);
  if(!force&&id===vpRequestId&&Date.now()-vpAt<45000)return Promise.resolve();vpAt=Date.now();vpRequestId=id;
  return vpBusy=(async()=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);
    try{const r=await fetch(`https://online.vhlru.ru/online/${id}.html`,{cache:'no-store',signal:c.signal});if(!r.ok)throw 0;const html=await r.text();
      if(!D||vpId()!==id)throw new Error('открыт другой матч');
      const penalties=LeaguePenalties.read(html,D,id);
      if(penalties){livePenalties=LeaguePenalties.merge(officialPenalties(),penalties);vpApply();updatePeriods();if(view!=null)show(view)}
      const doc=new DOMParser().parseFromString(html,'text/html');
      const teams=[...doc.querySelectorAll('.game__tablo .game__team-name')].map(el=>el.textContent.trim());
      const per=leagueSide(teams,D.home,D.away)>=0?vpParse(doc):null,pens=vpPens(html),goals=vpGoals(html);
      if(per){pens.homeL=teams[0];const was=VP&&VP.id===id?JSON.stringify([VP.per,VP.pens,VP.goals]):'';VP={id,per,pens,goals,teams,at:new Date()};vpApply();if(view!=null&&D&&vpId()===id&&JSON.stringify([per,pens,goals])!==was)show(view)}}catch(_){}
    clearTimeout(t);vpBusy=null})()}

function updatePeriods(){
  const source=officialPenalties(),periods=(source?.list||[]).map(x=>x.p).concat(source?.confirmed||[]);
  const mx=Math.max(1,source?.fin?3:1,Math.min(4,D.cur||1),...D.ev.map(x=>x.p).concat(periods).filter(p=>p>=1&&p<=4));
  D.maxP=mx;D.periods=Array.from({length:mx},(_,i)=>i+1);return mx;
}
function renderCall(){document.getElementById('call').innerHTML=`<p><b>Отчёт</b><span>${TITLE()}</span></p><div class="chips">${[...D.periods.map(p=>[p,PNAME(p)]),['m','Вся игра']].map(([v,t])=>`<button class="chip${v===view?' on':''}" data-p="${v}">${t}</button>`).join('')}<button class="btn go" id="prn"><span>Печать · </span>PDF</button></div>`}
function show(v){view=v;renderCall();document.getElementById('rep').innerHTML=body(v)+vpPenBlock(v);renderPaper(v)}
document.getElementById('call').onclick=e=>{if(e.target.closest('#prn')){vpLoad(true).then(()=>window.print());return}const b=e.target.closest('.chip');if(b)show(b.dataset.p==='m'?'m':+b.dataset.p)};
addEventListener('message',e=>{const d=e.data;if(!d||d.type!=='lm-report')return;const keep=D&&D.id===d.id?view:null;D=d;if(VP&&VP.id===vpId()&&leagueSide(VP.teams,D.home,D.away)<0){VP=null;vpAt=0}vpApply();
  const mx=updatePeriods();
  show(keep!=null&&(keep==='m'||keep<=mx)?keep:Math.min(d.cur,mx));vpLoad()});
addEventListener('afterprint',()=>{try{parent.postMessage({type:'lm-report-printed',p:view},'*')}catch(_){}});
try{parent.postMessage({type:'lm-report-ready'},'*')}catch(_){}
</script>
</body></html>
